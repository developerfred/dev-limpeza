name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  macos:
    name: macOS app + tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the app (Zig core + SwiftUI)
        run: ./make-app.sh
      - name: Incremental rescan equals full scan
        run: ./test-incremental.sh
      - name: Git safety checks on real repositories
        run: ./test-git.sh

  portable:
    name: Linux and Windows CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cross-compile every CLI target
        run: |
          for t in x86_64-linux-musl aarch64-linux-musl x86_64-windows-gnu aarch64-windows-gnu; do
            mkdir -p "dist/$t"
            ext=""; case "$t" in *windows*) ext=".exe" ;; esac
            zig build-exe src/main.zig -O ReleaseSafe -target "$t" -femit-bin="dist/$t/dev-cache-clean$ext"
          done
      - name: Smoke test the Linux binary
        run: |
          mkdir -p fx/p/node_modules/a && echo '{}' > fx/p/package.json && echo hello > fx/p/node_modules/a/f
          out=$(dist/x86_64-linux-musl/dev-cache-clean scan fx --days 0)
          echo "$out"
          echo "$out" | grep -q "1 caches"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/x86_64-windows-gnu/dev-cache-clean.exe
          if-no-files-found: error

  windows-smoke:
    name: Windows smoke test
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
      - name: Scan a fixture folder
        shell: bash
        run: |
          mkdir -p fx/p/node_modules/a && echo '{}' > fx/p/package.json && echo hello > fx/p/node_modules/a/f
          out=$(./dev-cache-clean.exe scan fx --days 0)
          echo "$out"
          echo "$out" | grep -q "1 caches"
